<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trips — Austin</title>
<link rel="preload" href="fonts/big-shoulders-display-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted, latin subset. Big Shoulders and Instrument Sans are variable
     fonts — one file each covers the whole weight range. Preloaded above so the
     first paint doesn't flash the fallback. */
  @font-face{
    font-family:"Big Shoulders Display";
    src:url("fonts/big-shoulders-display-var.woff2") format("woff2");
    font-weight:500 900; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"Instrument Sans";
    src:url("fonts/instrument-sans-var.woff2") format("woff2");
    font-weight:400 600; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Mono";
    src:url("fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Mono";
    src:url("fonts/ibm-plex-mono-500.woff2") format("woff2");
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Mono";
    src:url("fonts/ibm-plex-mono-600.woff2") format("woff2");
    font-weight:600; font-style:normal; font-display:swap;
  }
  :root{
    --night:#0A0A0D;
    --ember:#1C1712;
    --ember-deep:#C9A253;
    --gold:#C9A253;
    --leaf:#8B5E34;
    --done:#5E7F4A;
    --link:#8A6520;
    --paper:#F6F3EC;
    --card:#FFFFFF;
    --ink:#14120F;
    --muted:#6E675C;
    --hair:#E3DDD0;
    --shadow:0 1px 2px rgba(20,18,15,.06), 0 8px 24px rgba(20,18,15,.06);

    --display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
    --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    background:var(--night);
    color:#fff;
    overflow:hidden;
    padding:38px 0 0;
  }
  .hero .wrap{padding-bottom:0;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }
  h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(58px,17vw,124px);
    line-height:.82;
    letter-spacing:-.005em;
    text-transform:uppercase;
    margin:0;
  }
  h1 .thin{font-weight:500;color:#A89F8C;display:block;}
  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 26px;
    align-items:baseline;
    margin:24px 0 0;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.04em;
    color:#C9C2B2;
  }
  .hero-meta strong{color:#fff;font-weight:500;}
  .countdown{
    color:var(--night);
    background:var(--gold);
    padding:3px 9px 2px;
    border-radius:2px;
    font-weight:600;
  }
  /* court line motif under the hero */
  /* A single gold rule under the hero — the court markings went with the tennis. */
  .baseline{
    margin-top:30px;
    height:28px;
    border-top:1px solid rgba(201,162,83,.55);
  }

  .back{
    display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#A89F8C;text-decoration:none;margin:0 0 18px;padding:2px 0;
  }
  .back:hover{color:#fff;}
  .back:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  /* ---------- home: the list of trips ---------- */
  .trips{display:grid;gap:14px;margin:26px 0 0;}
  .trip-card{
    display:block;position:relative;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--hair);border-left:5px solid var(--accent,var(--gold));
    border-radius:8px;padding:18px 18px 16px;box-shadow:var(--shadow);
    transition:transform .16s ease,box-shadow .16s ease;
  }
  .trip-card:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(20,18,15,.08),0 12px 28px rgba(20,18,15,.10);}
  .trip-card:focus-visible{outline:2px solid var(--link);outline-offset:3px;}
  .trip-card .dates{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .trip-card .name{
    display:block;font-family:var(--display);font-size:38px;font-weight:800;text-transform:uppercase;
    line-height:.88;margin:8px 0 6px;letter-spacing:.005em;padding-right:96px;
  }
  .trip-card .sub{display:block;font-size:14px;color:var(--muted);}
  .trip-card .status{
    position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    padding:3px 9px 2px;border-radius:2px;background:var(--accent,var(--gold));color:var(--night);font-weight:600;
  }
  .trip-card.past{opacity:.55;}
  .trip-card.past .status{background:var(--hair);color:var(--muted);}
  @media (max-width:420px){
    .trip-card .name{padding-right:0;font-size:34px;}
    .trip-card .status{position:static;display:inline-block;margin-top:10px;}
  }

  /* ---------- scoreboard nav ---------- */
  .board{
    position:sticky;top:0;z-index:20;
    background:var(--night);
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .board-inner{
    max-width:760px;margin:0 auto;padding:0 12px;
    display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .board-inner::-webkit-scrollbar{display:none;}
  .day-btn{
    flex:1 0 64px;min-width:64px;
    background:none;border:0;
    border-right:1px solid rgba(255,255,255,.12);
    color:#A89F8C;
    padding:11px 4px 9px;
    cursor:pointer;
    font-family:var(--display);
    text-transform:uppercase;
    display:block;
    position:relative;
    transition:color .18s ease, background .18s ease;
  }
  .day-btn:last-child{border-right:0;}
  .day-btn .dow{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;}
  .day-btn .dnum{display:block;font-family:var(--mono);font-size:19px;font-weight:500;line-height:1.15;letter-spacing:-.02em;}
  .day-btn .serve{
    display:block;width:6px;height:6px;border-radius:50%;
    background:var(--gold);margin:5px auto 0;opacity:0;
  }
  .day-btn.has-session .serve{opacity:.55;}
  .day-btn:hover{color:#fff;background:rgba(255,255,255,.05);}
  .day-btn[aria-selected="true"]{color:#fff;}
  .day-btn[aria-selected="true"].has-session .serve{opacity:1;}
  .day-btn[aria-selected="true"]:after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold);
  }
  .day-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}

  /* ---------- day panel ---------- */
  .day-head{padding:34px 0 4px;}
  .day-head .kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px;
  }
  .day-head h2{
    font-family:var(--display);font-weight:800;text-transform:uppercase;
    font-size:clamp(34px,9vw,54px);line-height:.9;margin:0;letter-spacing:-.01em;
  }
  .day-head .tag{
    display:inline-block;margin-top:12px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
    color:var(--muted);border:1px solid var(--hair);
    padding:3px 9px;border-radius:99px;background:#fff;
  }

  /* timeline rail */
  .rail{
    position:relative;margin:26px 0 0;padding-left:78px;
  }
  .rail:before{
    content:"";position:absolute;left:56px;top:8px;bottom:14px;
    width:2px;background:var(--hair);
  }
  .item{position:relative;margin:0 0 14px;}
  .item .clock{
    position:absolute;right:calc(100% + 30px);top:14px;white-space:nowrap;text-align:right;
    font-family:var(--mono);font-size:12px;font-weight:500;
    color:var(--muted);letter-spacing:-.02em;line-height:1.25;
  }
  .item .clock em{display:block;font-style:normal;font-size:10.5px;color:#A39B8B;}
  .item .dot{
    position:absolute;left:-25px;top:19px;width:9px;height:9px;border-radius:50%;
    background:#fff;border:2px solid var(--hair);z-index:2;
  }
  .item.anchor .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,83,.32);}

  .card{
    background:var(--card);
    border:1px solid var(--hair);
    border-radius:6px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card-top{
    width:100%;text-align:left;background:none;border:0;
    padding:14px 16px;cursor:pointer;font:inherit;color:inherit;
    display:flex;gap:12px;align-items:flex-start;
  }
  .card-top:focus-visible{outline:2px solid var(--link);outline-offset:-2px;}
  .card-top .grow{flex:1 1 auto;min-width:0;}
  .kind{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);display:block;margin-bottom:3px;
  }
  .title{
    font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;
    line-height:1.02;letter-spacing:.005em;display:block;
  }
  .where{font-size:13.5px;color:var(--muted);margin-top:4px;display:block;}
  .chev{
    flex:0 0 auto;width:22px;height:22px;margin-top:4px;
    color:var(--muted);transition:transform .2s ease;
  }
  .card-top[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .body{display:none;padding:0 16px 16px;border-top:1px solid var(--hair);margin-top:-1px;}
  .body.open{display:block;}
  .body p{margin:12px 0 0;font-size:14.5px;}
  .facts{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;}
  .facts li{display:flex;gap:12px;font-size:13.5px;align-items:baseline;}
  .facts .lab{
    flex:0 0 92px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);
  }
  .facts .val{flex:1 1 auto;min-width:0;}
  .facts .val a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(138,101,32,.35);}
  .facts .val a:hover{border-bottom-color:var(--link);}
  .mono{font-family:var(--mono);letter-spacing:-.01em;}

  /* session cards — the anchor of each day */
  .card.session{background:var(--ember);border-color:var(--ember-deep);color:#fff;}
  .card.session .kind{color:var(--gold);}
  .card.session .where{color:#E2DCCF;}
  .card.session .chev{color:#E2DCCF;}
  .card.session .body{border-top-color:rgba(255,255,255,.2);}
  .card.session .facts .lab{color:#C9B98F;}
  .card.session .facts .val a{color:#fff;border-bottom-color:rgba(255,255,255,.45);}
  .card.session .stub{
    display:flex;align-items:baseline;gap:10px;margin-top:12px;
    padding-top:12px;border-top:1px dashed rgba(255,255,255,.3);
  }
  .card.session .stub .big{
    font-family:var(--display);font-size:40px;font-weight:800;line-height:.85;color:var(--gold);
  }
  .card.session .stub .lil{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#E2DCCF;}

  /* travel cards */
  .card.travel{border-left:3px solid var(--night);}
  .card.meal{border-left:3px solid var(--leaf);}

  /* open slot */
  .card.open-slot{background:transparent;border-style:dashed;box-shadow:none;}
  .card.open-slot .title{color:var(--muted);font-weight:600;}

  /* watch the clock note */
  .note{
    margin:2px 0 16px 0;
    background:#FBF3DF;border:1px solid #E4CF9B;border-radius:6px;
    padding:11px 14px;font-size:13.5px;
  }
  .note b{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    display:block;margin-bottom:3px;color:#7A5B1E;
  }

  /* ---------- section blocks ---------- */
  .section{margin-top:44px;}
  .section > h3{
    font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;
    margin:0 0 4px;letter-spacing:.005em;
  }
  .section > .sub{font-size:14px;color:var(--muted);margin:0 0 16px;}

  .basecamp{
    background:var(--night);color:#fff;border-radius:8px;padding:22px 20px;
  }
  .basecamp .addr{
    font-family:var(--display);font-size:32px;font-weight:700;text-transform:uppercase;
    line-height:.95;margin:0 0 2px;
  }
  .basecamp .addr span{display:block;color:#A89F8C;font-weight:500;font-size:20px;}
  .basecamp .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  .calbox{background:var(--night);color:#fff;border-radius:8px;padding:22px 20px;}
  .merge{background:var(--night);color:#fff;border-radius:8px;padding:20px;margin:0 0 18px;}
  .merge-head{
    font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;
    margin:0 0 2px;letter-spacing:.005em;
  }
  .merge-sub{font-size:13.5px;color:#A89F8C;margin:0 0 4px;}
  .merge-list{list-style:none;margin:0 0 16px;padding:14px 0 0;border-top:1px solid rgba(255,255,255,.2);}
  .merge-list li{font-size:13.5px;color:#E2DCCF;padding:4px 0;display:flex;gap:10px;align-items:baseline;}
  .merge-list .tag{
    font-family:var(--mono);font-size:10.5px;color:var(--gold);text-transform:uppercase;
    letter-spacing:.08em;white-space:nowrap;flex:none;min-width:62px;
  }
  .merge-list .val{flex:1;}
  .merge-list .val b{color:#fff;font-weight:600;}
  .merge .row{display:flex;gap:10px;flex-wrap:wrap;}
  .shareRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;}
  .shareRow .hint{font-size:12.5px;color:var(--muted);}
  /* .btn is white-on-navy; .ink is the same button on the paper background. */
  .btn.ink{border-color:rgba(20,18,15,.3);color:var(--ink);}
  .btn.ink:hover{background:rgba(20,18,15,.06);}
  .btn.ink.solid{background:var(--night);color:#fff;border-color:var(--night);}
  .btn.ink.solid:hover{background:#2A2620;}
  .calbox .row{display:flex;gap:10px;flex-wrap:wrap;}
  .callist{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid rgba(255,255,255,.2);}
  .callist li{
    display:flex;gap:12px;align-items:baseline;justify-content:space-between;
    font-size:13.5px;color:#E2DCCF;padding:5px 0;
  }
  .callist .when{font-family:var(--mono);font-size:11px;color:var(--gold);white-space:nowrap;letter-spacing:.04em;}
  .callist .alarm{font-family:var(--mono);font-size:11px;color:#A89F8C;white-space:nowrap;}
  .callist .what{flex:1;}
  @media (max-width:420px){
    .callist li{flex-wrap:wrap;gap:2px 10px;}
    .callist .what{flex:1 0 100%;order:3;}
  }
  .btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 13px;border-radius:4px;border:1px solid rgba(255,255,255,.35);
    background:transparent;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;
    transition:background .16s ease,border-color .16s ease;
  }
  .btn:hover{background:rgba(255,255,255,.12);}
  .btn.solid{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:600;}
  .btn.solid:hover{background:#D8B665;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .steps{list-style:none;counter-reset:s;margin:20px 0 0;padding:18px 0 0;border-top:1px solid rgba(255,255,255,.2);}
  .steps li{
    counter-increment:s;position:relative;padding-left:34px;margin-bottom:11px;
    font-size:14px;color:#E2DCCF;
  }
  .steps li:before{
    content:counter(s);position:absolute;left:0;top:0;
    font-family:var(--mono);font-size:11px;color:var(--gold);
    border:1px solid rgba(201,162,83,.5);border-radius:50%;
    width:21px;height:21px;display:flex;align-items:center;justify-content:center;
  }
  .steps li b{color:#fff;font-weight:600;}

  /* checklist */
  .todo{display:grid;gap:8px;}
  .todo-item{
    background:#fff;border:1px solid var(--hair);border-radius:6px;padding:12px 14px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .todo-item.done{background:#F0F2EA;border-color:#C9D2BC;}
  .cbox{
    flex:0 0 auto;width:20px;height:20px;margin-top:1px;border-radius:4px;
    border:1.5px solid #BDB5A6;background:#fff;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .cbox:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .todo-item.done .cbox{background:var(--done);border-color:var(--done);}
  .cbox svg{opacity:0;width:12px;height:12px;color:#fff;}
  .todo-item.done .cbox svg{opacity:1;}
  .todo-body{flex:1 1 auto;min-width:0;}
  .todo-label{font-size:14.5px;font-weight:500;display:block;}
  .todo-item.done .todo-label{text-decoration:line-through;color:var(--muted);}
  .todo-when{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px;}
  .todo-input{
    width:100%;margin-top:8px;border:0;border-bottom:1px solid var(--hair);
    font-family:var(--body);font-size:13.5px;padding:4px 0;background:transparent;color:var(--ink);
  }
  .todo-input::placeholder{color:#B5AEA0;}
  .todo-input:focus{outline:none;border-bottom-color:var(--link);}
  .progress{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 14px;
  }
  .progress b{color:var(--ink);}

  .foot{
    margin-top:48px;padding-top:18px;border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#9B9384;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
    background:var(--night);color:#fff;padding:9px 16px;border-radius:99px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:560px){
    .rail{padding-left:62px;}
    .rail:before{left:44px;}
    .item .clock{right:calc(100% + 26px);font-size:11px;}
    .item .dot{left:-22px;}
    .facts li{flex-direction:column;gap:2px;}
    .facts .lab{flex:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;scroll-behavior:auto !important;}
  }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trips">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <a class="back" id="back" href="#trips" hidden>← All trips</a>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <div class="hero-meta" id="heroMeta"></div>
    <div class="baseline" aria-hidden="true"></div>
  </div>
</header>

<nav class="board" id="boardNav" aria-label="Days" hidden>
  <div class="board-inner" id="board" role="tablist"></div>
</nav>

<main class="wrap">
  <section id="home" hidden>
    <div class="trips" id="trips"></div>
  </section>

  <div id="tripView" hidden>
    <div id="days"></div>

    <section class="section" id="stay" hidden>
      <h3>Base camp</h3>
      <p class="sub" id="staySub"></p>
      <div class="basecamp" id="stayBox"></div>
    </section>

    <section class="section">
      <h3>Calendar</h3>
      <p class="sub" id="calSub"></p>
      <div class="calbox">
        <div class="row">

  /* ---------- dates ---------- */
  function today0(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function dayCount(t){ return Math.round((iso(t.end) - iso(t.start))/86400000) + 1; }
  function shortRange(t){
    var a = iso(t.start), b = iso(t.end);
    if(t.start === t.end) return DOW[a.getDay()].slice(0,3) + " " + MON3[a.getMonth()] + " " + a.getDate();
    var same = a.getMonth() === b.getMonth();
    return MON3[a.getMonth()] + " " + a.getDate() + " – " + (same ? "" : MON3[b.getMonth()] + " ") + b.getDate();
  }
  /* "5 days out" / "Day 2 of 4" / "Wrapped" — used by the hero pill and the home cards */
  function status(t){
    var s = iso(t.start), e = iso(t.end), td = today0();
    if(td > e) return {text:"Wrapped", state:"past"};
    if(td >= s) return {text:(dayCount(t) === 1 ? "Today" : "Day " + (Math.round((td - s)/86400000) + 1) + " of " + dayCount(t)), state:"now"};
    var d = Math.round((s - td)/86400000);
    return {text:(d === 1 ? "Tomorrow" : d + " days out"), state:"soon"};
  }
  function defaultDay(t){
    var s = iso(t.start), td = today0(), i = Math.round((td - s)/86400000);
    return (i >= 0 && i < t.days.length) ? i : 0;
  }

  /* ---------- theme ---------- */
  function applyTheme(t){
    var r = document.documentElement.style;
    ["gold","link","ember"].forEach(function(k){ r.removeProperty("--" + k); });
    r.removeProperty("--ember-deep");
    if(t && t.theme){
      r.setProperty("--gold", t.theme.gold); r.setProperty("--ember-deep", t.theme.gold);
      r.setProperty("--link", t.theme.link); r.setProperty("--ember", t.theme.ember);
    }
  }

  /* ---------- routing ---------- */
  var trip = null;               /* the trip on screen, or null on the home page */
  function tripById(id){ for(var i=0;i<TRIPS.length;i++) if(TRIPS[i].id === id) return TRIPS[i]; return null; }
  function hashTrip(){ var mm = /^#([a-z0-9-]+)/.exec(location.hash); return mm ? mm[1] : ""; }

  function route(){
    var id = hashTrip(), next = null;
    if(id === "trips") next = null;
    else if(id) next = tripById(id);
    else {
      /* No hash: during a trip, open straight to it — that's the one-handed case. */
      for(var i=0;i<TRIPS.length;i++) if(status(TRIPS[i]).state === "now") next = TRIPS[i];
    }
    if(id && id !== "trips" && !next){ toast("No trip called " + id); next = null; }
    if(next) showTrip(next); else showHome();
  }

  /* ---------- home ---------- */
  function showHome(){
    trip = null;
    applyTheme(null);
    document.title = "Trips — Austin";
    document.getElementById("back").hidden = true;
    document.getElementById("eyebrow").textContent = "Personal itinerary · " + TRIPS.length + " trips";
    document.getElementById("h1").innerHTML = "Austin's<span class=\"thin\">Trips</span>";
    var upcoming = TRIPS.filter(function(t){ return status(t).state !== "past"; })
                        .sort(function(a,b){ return a.start < b.start ? -1 : 1; });
    var nextT = upcoming[0];
    document.getElementById("heroMeta").innerHTML = nextT
      ? '<span><strong>Up next</strong></span><span>' + h(nextT.name) + ' · ' + shortRange(nextT) + '</span>' +
        '<span class="countdown">' + status(nextT).text + '</span>'
      : '<span>Nothing on the books</span>';
    document.getElementById("boardNav").hidden = true;
    document.getElementById("tripView").hidden = true;
    var home = document.getElementById("home"); home.hidden = false;

    var sorted = TRIPS.slice().sort(function(a,b){
      var pa = status(a).state === "past", pb = status(b).state === "past";
      if(pa !== pb) return pa ? 1 : -1;               /* wrapped trips sink */
      return a.start < b.start ? -1 : 1;
    });
    document.getElementById("trips").innerHTML = sorted.map(function(t){
      var st = status(t);
      return '<a class="trip-card ' + st.state + '" href="#' + t.id + '" style="--accent:' + t.theme.gold + '">' +
        '<span class="dates">' + shortRange(t) + ', ' + iso(t.start).getFullYear() + ' · ' + (t.local ? 'Local' : dayCount(t) + ' days') + '</span>' +
        '<span class="name">' + h(t.name) + '</span>' +
        '<span class="sub">' + h(t.sub) + '</span>' +
        '<span class="status">' + st.text + '</span>' +
      '</a>';
    }).join("");
    document.getElementById("foot").innerHTML = "<span>Austin</span><span>" + new Date().getFullYear() + "</span>";
    window.scrollTo(0,0);
  }

  /* ---------- trip ---------- */
  function showTrip(t){
    var switching = trip !== t;
    trip = t;
    applyTheme(t);
    document.title = t.name + " — Itinerary";
    document.getElementById("back").hidden = false;
    document.getElementById("eyebrow").textContent = t.eyebrow;
    document.getElementById("h1").innerHTML = h(t.h1[0]) + '<span class="thin">' + h(t.h1[1]) + '</span>';
    document.getElementById("heroMeta").innerHTML =
      t.meta.map(function(x,i){ return '<span>' + (i===0 ? '<strong>'+h(x)+'</strong>' : h(x)) + '</span>'; }).join("") +
      '<span id="countdown" class="countdown">' + status(t).text + '</span>';
    document.getElementById("home").hidden = true;
    document.getElementById("boardNav").hidden = t.days.length < 2;   /* one day needs no tabs */
    document.getElementById("tripView").hidden = false;
    document.getElementById("foot").innerHTML = "<span>" + h(t.name) + "</span><span>" + shortRange(t) + ", " + iso(t.start).getFullYear() + "</span>";

    renderDays(t);
    select(defaultDay(t));
    renderStay(t);
    loadState();
    renderTodos();
    renderCal();
    hideMerge();
    if(switching) window.scrollTo(0,0);
  }

  function renderStay(t){
    var sec = document.getElementById("stay");
    document.getElementById("calSub").textContent = t.calNote;
    if(!t.stay){ sec.hidden = true; return; }
    sec.hidden = false;
    var s = t.stay;
    document.getElementById("staySub").textContent = s.sub;
    document.getElementById("stayBox").innerHTML =
      '<p class="addr">' + h(s.addr) + ' <span>' + h(s.addr2) + '</span></p>' +
      '<div class="row">' +
        '<button class="btn solid" data-copy="' + h(s.copy) + '">Copy address</button>' +
        '<a class="btn" href="' + m(s.copy) + '" target="_blank" rel="noopener">Open in Maps</a>' +
      '</div>' +
      '<ol class="steps">' + s.steps.map(function(st){ return '<li><b>' + st[0] + '</b> ' + st[1] + '</li>'; }).join("") + '</ol>';
  }

  /* ---------- render ---------- */
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

  function renderDays(t){
    var board = document.getElementById("board");
    var host  = document.getElementById("days");
    board.innerHTML = t.days.map(function(d,i){
      var dt = iso(d.d);
      var hasSession = d.items.some(function(x){return x.cls === "session";});
      return '<button class="day-btn'+(hasSession?" has-session":"")+'" role="tab" aria-selected="'+(i===0)+'" data-i="'+i+'">' +
        '<span class="dow">'+DOW[dt.getDay()].slice(0,3)+'</span><span class="dnum">'+(dt.getDate()<10?"0":"")+dt.getDate()+'</span>' +
        '<span class="serve" aria-hidden="true"></span></button>';
    }).join("");
    host.innerHTML = t.days.map(function(d,i){
      var dt = iso(d.d);
      return '<section class="day-panel" data-i="'+i+'" '+(i===0?"":'hidden')+'>' +
        '<div class="day-head"><p class="kicker">'+DOW[dt.getDay()]+', '+MON[dt.getMonth()]+' '+dt.getDate()+'</p><h2>'+d.title+'</h2>' +
        '<span class="tag">'+d.tag+'</span></div>' +
        '<div class="rail">' + d.items.map(function(it,ii){return itemHTML(it,i,ii);}).join("") + '</div>' +
      '</section>';
    }).join("");
  }

  function select(i){
    document.querySelectorAll(".day-btn").forEach(function(b,j){
      b.setAttribute("aria-selected", String(i===j));
      if(i===j && b.scrollIntoView) b.scrollIntoView({block:"nearest", inline:"center"});
    });
    document.querySelectorAll(".day-panel").forEach(function(p,j){ p.hidden = (i!==j); });
    var board = document.querySelector(".board");
    if(!board.hidden && window.scrollY > board.offsetTop) window.scrollTo({top: board.offsetTop});
  }

  function itemHTML(it, di, ii){
    var uid = "e-" + di + "-" + ii;
    var facts = "";
    if(it.facts && it.facts.length){
      facts = '<ul class="facts">' + it.facts.map(function(f){
        return '<li><span class="lab">'+f[0]+'</span><span class="val">'+f[1]+'</span></li>';
      }).join("") + '</ul>';
    }
    var stub = it.session
      ? '<div class="stub"><span class="big">'+it.session+'</span><span class="lil">Event</span></div>'
      : "";
    var hasBody = !!(facts || stub);
    var timeParts = it.time.split(" ");
    var clock = '<span class="clock">'+timeParts[0]+(timeParts[1]?'<em>'+timeParts[1]+'</em>':'')+'</span>';

    return '<div class="item'+(it.anchor?" anchor":"")+'">' +
      clock +
      '<span class="dot" aria-hidden="true"></span>' +
      '<article class="card '+(it.cls||"")+'">' +
        '<button class="card-top" aria-expanded="false" aria-controls="'+uid+'"'+(hasBody?"":' disabled style="cursor:default"')+'>' +
          '<span class="grow">' +
            '<span class="kind">'+it.kind+'</span>' +
            '<span class="title">'+it.title+'</span>' +
            (it.where?'<span class="where">'+it.where+'</span>':'') +
          '</span>' +
          (hasBody?CHEV:'') +
        '</button>' +
        (hasBody?'<div class="body" id="'+uid+'">'+facts+stub+'</div>':'') +
      '</article>' +
    '</div>' +
    (it.note ? '<div class="note"><b>Watch the clock</b>'+it.note+'</div>' : '');
  }
  /* ---------- checklist (persists when storage is available) ---------- */
  var state = {};
  function KEY(){ return "trips:" + trip.id + ":plan"; }

  function loadState(){
    state = {};
    try{
      var raw = localStorage.getItem(KEY());
      /* The Atlanta checklist predates multiple trips — carry it across once. */
      if(!raw && trip.id === "atl") raw = localStorage.getItem("atl2026:plan");
      if(raw) state = JSON.parse(raw) || {};
    }catch(err){ state = {}; }
  }
  function saveState(){
    try{ localStorage.setItem(KEY(), JSON.stringify(state)); }
    catch(err){ /* private mode or storage full — keep going in memory */ }
  }

  function renderTodos(){
    var host = document.getElementById("todo");
    host.innerHTML = trip.todos.map(function(t){
      var s = state[t.id] || {};
      return '<div class="todo-item'+(s.done?" done":"")+'" data-id="'+t.id+'">' +
        '<button class="cbox" aria-pressed="'+(s.done?"true":"false")+'" aria-label="Mark '+t.label.replace(/"/g,"")+'">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</button>' +
        '<div class="todo-body">' +
          '<span class="todo-when">'+t.when+'</span>' +
          '<span class="todo-label">'+t.label+'</span>' +
          '<input class="todo-input" type="text" placeholder="What\'s the plan?" value="'+h(s.note||"")+'">' +
        '</div></div>';
    }).join("");
    updateProgress();
  }

  function updateProgress(){
    var done = trip.todos.filter(function(t){ return state[t.id] && state[t.id].done; }).length;
    document.getElementById("progress").innerHTML = "<b>"+done+"</b> of <b>"+trip.todos.length+"</b> locked in";
  }

  function wireTodos(){
    var host = document.getElementById("todo");   /* delegated once; survives every re-render */
    host.addEventListener("click", function(e){
      var b = e.target.closest(".cbox"); if(!b) return;
      var row = b.closest(".todo-item"), id = row.dataset.id;
      state[id] = state[id] || {};
      state[id].done = !state[id].done;
      state[id].dts = nowSec();
      row.classList.toggle("done", state[id].done);
      b.setAttribute("aria-pressed", String(state[id].done));
      updateProgress(); saveState();
    });
    var timer;
    host.addEventListener("input", function(e){
      if(!e.target.classList.contains("todo-input")) return;
      var id = e.target.closest(".todo-item").dataset.id;
      state[id] = state[id] || {};
      state[id].note = e.target.value;
      state[id].nts = nowSec();
      clearTimeout(timer); timer = setTimeout(saveState, 500);
    });
  }

  /* ---------- sharing the checklist ----------
     No server and no account: the checklist is packed into a link, sent by text,
     and merged on the other phone. `done` and `note` carry separate timestamps so
     a merge takes the newer of the two per field instead of letting one phone
     clobber the other. Notes written before this existed have no timestamp and
     count as oldest, so an incoming value wins.
     Everything here is local — encoding a link works with no signal. */

  function nowSec(){ return Math.floor(Date.now() / 1000); }

  function h(v){
    return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function b64url(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function unb64url(v){
    var t = v.replace(/-/g,"+").replace(/_/g,"/");
    while(t.length % 4) t += "=";
    var bin = atob(t), bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  var NOTE_MAX = 500;

  function packPlan(){
    var out = {};
    trip.todos.forEach(function(t){
      var s = state[t.id];
      if(!s) return;
      /* An item that was checked and then unchecked still has a timestamp, and
         still needs to travel — otherwise the uncheck never reaches the other phone. */
      if(!s.done && !s.note && !s.dts && !s.nts) return;
      var rec = {};
      if(s.done) rec.d = 1;
      if(s.note) rec.n = String(s.note).slice(0, NOTE_MAX);
      if(s.dts)  rec.x = s.dts;
      if(s.nts)  rec.y = s.nts;
      out[t.id] = rec;
    });
    return {v:2, trip:trip.id, t:nowSec(), i:out};
  }

  function planChanges(inc){
    var known = {}, out = [];
    trip.todos.forEach(function(t){ known[t.id] = t; });
    Object.keys(inc.i || {}).forEach(function(id){
      if(!known[id]) return;                       /* an id this build doesn't have */
      var r = inc.i[id] || {}, mine = state[id] || {};
      var theirDone = !!r.d, theirDts = Number(r.x) || 0;
      var theirNote = String(r.n || "").slice(0, NOTE_MAX), theirNts = Number(r.y) || 0;
      if(theirDts > (mine.dts || 0) && theirDone !== !!mine.done){
        out.push({id:id, field:"done", value:theirDone, ts:theirDts, label:known[id]});
      }
      if(theirNts > (mine.nts || 0) && theirNote !== (mine.note || "")){
        out.push({id:id, field:"note", value:theirNote, ts:theirNts, label:known[id]});
      }
    });
    return out;
  }

  function applyChanges(changes){
    changes.forEach(function(c){
      var s = state[c.id] = state[c.id] || {};
      if(c.field === "done"){ s.done = c.value; s.dts = c.ts; }
      else { s.note = c.value; s.nts = c.ts; }
    });
    saveState();
    renderTodos();
  }

  function changeRow(c){
    var tag, val;
    var name = "<b>" + h(c.label.when) + " · " + h(c.label.label) + "</b>";
    if(c.field === "done"){
      tag = c.value ? "Checked" : "Unchecked";
      val = name;
    } else {
      tag = c.value ? "Note" : "Cleared";
      val = name + (c.value ? " — " + h(c.value) : "");
    }
    return '<li><span class="tag">' + tag + '</span><span class="val">' + val + '</span></li>';
  }

  var pendingChanges = null;

  function showMerge(changes){
    pendingChanges = changes;
    var box = document.getElementById("merge");
    document.getElementById("mergeSub").textContent =
      changes.length + (changes.length === 1 ? " update" : " updates") +
      " in that link that you don't have. Your newer notes stay put.";
    document.getElementById("mergeList").innerHTML = changes.map(changeRow).join("");
    box.hidden = false;
    box.scrollIntoView({block:"center", behavior:"smooth"});
  }
  function hideMerge(){
    pendingChanges = null;
    document.getElementById("merge").hidden = true;
  }

  function readSharedLink(){
    var m = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash);
    if(!m) return;
    /* Drop the payload from the URL straight away so a refresh doesn't ask again,
       but keep the trip so the page stays where it is. */
    try{ history.replaceState(null, "", location.href.split("#")[0] + (trip ? "#" + trip.id : "")); }catch(err){}
    var inc;
    try{
      if(m[1].length > 200000) throw new Error("oversized");
      inc = JSON.parse(unb64url(m[1]));
    }catch(err){ toast("That link didn't read properly"); return; }
    if(!inc || inc.v !== 2 || typeof inc.i !== "object"){
      toast("That link is from a different version"); return;
    }
    if(!trip || inc.trip !== trip.id){
      var other = tripById(inc.trip);
      toast(other ? "That link is for " + other.name : "That link is for a trip this build doesn't have"); return;
    }
    var changes = planChanges(inc);
    if(!changes.length){ toast("Nothing new in that link"); return; }
    showMerge(changes);
  }

  function planLink(){
    return location.href.split("#")[0] + "#" + trip.id + "&s=" + b64url(JSON.stringify(packPlan()));
  }
  function copyPlanLink(url){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(function(){ toast("Link copied — text it over"); })
        .catch(function(){ toast("Couldn't copy the link"); });
    } else { toast("Copy isn't available here"); }
  }
  function sharePlan(){
    var url = planLink();
    if(navigator.share){
      navigator.share({title:trip.name, text:"My notes for " + trip.name, url:url})
        .then(function(){ toast("Sent"); })
        .catch(function(err){ if(!err || err.name !== "AbortError") copyPlanLink(url); });
    } else copyPlanLink(url);
  }

  function wireShare(){
    document.getElementById("shareBtn").addEventListener("click", sharePlan);
    /* A link tapped while the app is already open only changes the fragment —
       the page never reloads, so init doesn't run again. Catch it here. */
    window.addEventListener("hashchange", function(){ route(); readSharedLink(); });
    document.getElementById("mergeYes").addEventListener("click", function(){
      var n = pendingChanges ? pendingChanges.length : 0;
      if(pendingChanges) applyChanges(pendingChanges);
      hideMerge();
      toast(n + (n === 1 ? " update merged" : " updates merged"));
    });
    document.getElementById("mergeNo").addEventListener("click", function(){
      hideMerge();
      toast("Left your notes alone");
    });
  }

  /* ---------- calendar ----------
     Events are declared inline on the trip's items (the `ics` field) so a time that
     changes on a card changes in the .ics too. Only booked things carry one.
     TZID + VTIMEZONE rather than UTC, so the flights keep their two timezones and
     every client reads the same wall-clock time. */

  function zone(tzid, dName, dFrom, dTo, sName, sFrom, sTo){
    return [
      "BEGIN:VTIMEZONE","TZID:"+tzid,
      "BEGIN:DAYLIGHT","TZOFFSETFROM:"+dFrom,"TZOFFSETTO:"+dTo,"TZNAME:"+dName,
      "DTSTART:19700308T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU","END:DAYLIGHT",
      "BEGIN:STANDARD","TZOFFSETFROM:"+sFrom,"TZOFFSETTO:"+sTo,"TZNAME:"+sName,
      "DTSTART:19701101T020000","RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU","END:STANDARD",
      "END:VTIMEZONE"
    ];
  }
  var ZONES = {
    "America/New_York": zone("America/New_York","EDT","-0500","-0400","EST","-0400","-0500"),
    "America/Chicago":  zone("America/Chicago", "CDT","-0600","-0500","CST","-0500","-0600"),
    "America/Indiana/Indianapolis": zone("America/Indiana/Indianapolis","EDT","-0500","-0400","EST","-0400","-0500"),
    /* Mexico stopped observing DST in 2022 — a single fixed offset. */
    "America/Mexico_City": ["BEGIN:VTIMEZONE","TZID:America/Mexico_City","BEGIN:STANDARD",
      "TZOFFSETFROM:-0600","TZOFFSETTO:-0600","TZNAME:CST","DTSTART:19700101T000000","END:STANDARD","END:VTIMEZONE"]
  };

  function calEvents(){
    var out = [];
    trip.days.forEach(function(d){
      d.items.forEach(function(it){ if(it.ics) out.push(it.ics); });
    });
    return out;
  }

  /* RFC 5545 TEXT escaping, then 75-octet line folding. */
  function icsEsc(v){
    return String(v).replace(/\\/g,"\\\\").replace(/([;,])/g,"\\$1").replace(/\r?\n/g,"\\n");
  }
  function octets(ch){
    var c = ch.codePointAt(0);
    return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
  }
  function fold(line){
    var chars = Array.from(line), out = [], cur = "", len = 0;
    for(var i=0;i<chars.length;i++){
      var n = octets(chars[i]);
      if(len + n > 75){ out.push(cur); cur = " "; len = 1; }
      cur += chars[i]; len += n;
    }
    out.push(cur);
    return out.join("\r\n");
  }
  function utcStamp(d){
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getUTCFullYear() + p(d.getUTCMonth()+1) + p(d.getUTCDate()) + "T" +
           p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
  }
  function icsLocal(v){ return v.replace(/[-:]/g,"") + "00"; }

  function buildIcs(){
    var evs = calEvents(), used = {}, lines = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Austin's Trips//Itinerary//EN",
      "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:" + icsEsc(trip.name)
    ];
    evs.forEach(function(e){ used[e.start[1]] = 1; used[e.end[1]] = 1; });
    Object.keys(used).forEach(function(z){ lines = lines.concat(ZONES[z]); });

    var now = utcStamp(new Date());
    evs.forEach(function(e){
      lines.push(
        "BEGIN:VEVENT",
        "UID:" + trip.uid + "-" + e.uid + "@19awburris88.github.io",
        "DTSTAMP:" + now,
        "SEQUENCE:0",
        "DTSTART;TZID=" + e.start[1] + ":" + icsLocal(e.start[0]),
        "DTEND;TZID="   + e.end[1]   + ":" + icsLocal(e.end[0]),
        "SUMMARY:"     + icsEsc(e.summary),
        "LOCATION:"    + icsEsc(e.location),
        "DESCRIPTION:" + icsEsc(e.desc),
        "BEGIN:VALARM","ACTION:DISPLAY",
        "DESCRIPTION:" + icsEsc(e.summary),
        "TRIGGER:-PT" + e.alarm + "M","END:VALARM",
        "END:VEVENT"
      );
    });
    lines.push("END:VCALENDAR");
    return lines.map(fold).join("\r\n") + "\r\n";
  }

  var CAL_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function calWhen(v){
    var d = v.slice(0,10).split("-"), t = v.slice(11).split(":");
    var h = Number(t[0]);
    return CAL_MON[Number(d[1]) - 1] + " " + Number(d[2]) + " · " +
           (h % 12 || 12) + ":" + t[1] + " " + (h >= 12 ? "PM" : "AM");
  }
  function calAlarm(n){ return (n % 60 === 0 ? (n/60) + "h" : n + " min") + " before"; }

  function icsName(){ return trip.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + ".ics"; }
  function icsBlob(){
    return new Blob([buildIcs()], {type:"text/calendar;charset=utf-8"});
  }
  function icsDownload(){
    var url = URL.createObjectURL(icsBlob());
    var a = document.createElement("a");
    a.href = url; a.download = icsName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast(calEvents().length + " events downloaded");
  }
  function icsShare(){
    var file = new File([icsBlob()], icsName(), {type:"text/calendar"});
    navigator.share({files:[file], title:trip.name})
      .then(function(){ toast("Sent"); })
      .catch(function(err){ if(!err || err.name !== "AbortError") icsDownload(); });
  }
  function canShareIcs(){
    if(!(window.File && navigator.canShare && navigator.share)) return false;
    try {
      return navigator.canShare({files:[new File([""], "x.ics", {type:"text/calendar"})]});
    } catch(err){ return false; }
  }

  function renderCal(){
    var evs = calEvents(), empty = evs.length === 0;
    document.getElementById("icsBtn").disabled = empty;
    document.getElementById("icsShare").disabled = empty;
    if(empty){
      document.getElementById("callist").innerHTML = '<li><span class="what">Nothing with a fixed time yet — items join here once they have one.</span></li>';
      return;
    }
    document.getElementById("callist").innerHTML = evs.map(function(e){
      return '<li>' +
        '<span class="when">' + calWhen(e.start[0]) + '</span>' +
        '<span class="what">' + e.summary + '</span>' +
        '<span class="alarm">' + calAlarm(e.alarm) + '</span>' +
      '</li>';
    }).join("");
  }
  function wireCal(){
    document.getElementById("icsBtn").addEventListener("click", icsDownload);
    var sh = document.getElementById("icsShare");
    if(canShareIcs()){ sh.hidden = false; sh.addEventListener("click", icsShare); }
  }

  /* ---------- copy ---------- */
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    setTimeout(function(){ el.classList.remove("show"); }, 1600);
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-copy]"); if(!b) return;
    var text = b.dataset.copy;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("Address copied"); })
        .catch(function(){ toast("Copy didn't go through"); });
    } else { toast("Copy isn't available here"); }
  });

  /* ---------- go ---------- */
  (function init(){
    wireTodos();
    wireShare();
    wireCal();
    document.getElementById("days").addEventListener("click", function(e){
      var t = e.target.closest(".card-top"); if(!t || t.disabled) return;
      var open = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", String(!open));
      document.getElementById(t.getAttribute("aria-controls")).classList.toggle("open", !open);
    });
    document.getElementById("board").addEventListener("click", function(e){
      var b = e.target.closest(".day-btn"); if(!b) return;
      select(parseInt(b.dataset.i,10));
    });
    route();
    readSharedLink();
  })();

  /* ---------- service worker ---------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline cache unavailable */ });
    });
  }
})();
</script>

</body>
</html>
